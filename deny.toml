# cargo-deny policy — https://embarkstudios.github.io/cargo-deny/
# Wired into githooks/pre-push and CI via `just check`.

[graph]
# collect metadata with all features so no platform/feature dep tree is missed
all-features = true

[licenses]
version = 2
# permissive licenses accepted for dependencies; extend as needed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # demo branch: servo/HTML-parsing stack pulled in by dioxus (cssparser,
    # selectors, dtoa-short) plus option-ext; MPL-2.0 is file-level copyleft
    # and does not affect the licenses of this crate
    "MPL-2.0",
    # demo branch: libfuzzer-sys (via dioxus wasm tooling) is
    # "(MIT OR Apache-2.0) AND NCSA"; NCSA is the permissive UIUC/LLVM license
    "NCSA",
    # demo branch: the embedded kanata library is LGPL-3.0-only (weak
    # copyleft). Private/internal use has no obligations; DISTRIBUTING the exe
    # requires the kanata source link plus the object files / relink means per
    # LGPL §4/§6. BSL-1.0 (Boost) covers clipboard-win/error-code. The plain
    # "LGPL-3.0" entry is karabiner-driverkit metadata (macOS only, never
    # compiled for the Windows target).
    "LGPL-3.0-only",
    "LGPL-3.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# demo branch (AGENTS.md §2: upstream noise, no fix available): all
# "unmaintained"/"unsound" notices from the GTK3/glib stack that only exists
# in the lockfile because [graph] collects every platform's metadata
# (wry/muda Linux backends) — none of it is compiled for the Windows target.
ignore = [
    "RUSTSEC-2024-0370", # rand 0.7 unsound (via gtk ecosystem)
    "RUSTSEC-2024-0411", # gdkwayland-sys unmaintained
    "RUSTSEC-2024-0412", # gdk unmaintained
    "RUSTSEC-2024-0413", # atk unmaintained
    "RUSTSEC-2024-0414", # gdkx11-sys unmaintained
    "RUSTSEC-2024-0415", # gtk unmaintained
    "RUSTSEC-2024-0416", # atk-sys unmaintained
    "RUSTSEC-2024-0418", # gdk-sys unmaintained
    "RUSTSEC-2024-0419", # gtk-sys unmaintained
    "RUSTSEC-2024-0420", # glib unsound
    "RUSTSEC-2024-0429", # proc-macro-error unmaintained
    "RUSTSEC-2024-0436", # gtk3-macros unmaintained
    "RUSTSEC-2025-0057", # fxhash unmaintained
    "RUSTSEC-2026-0097", # paste unmaintained
    "RUSTSEC-2023-0089", # atomic-polyfill unmaintained (keyberon no_std path)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
