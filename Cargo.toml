[package]
name = "enable-touchpad"
version = "0.1.0"
edition = "2024"
description = "Windows 11 precision-touchpad utility with an embedded kanata layer engine and a layered multi-platform architecture."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NIyueeE/enable-touchpad"

[workspace]
members = [".", "etp-core", "etp-platform", "etp-ffi"]
default-members = [".", "etp-core", "etp-platform", "etp-ffi"]
resolver = "3"

[dependencies]
etp-core = { version = "0.1.0", path = "etp-core" }
etp-platform = { version = "0.1.0", path = "etp-platform" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[target."cfg(windows)".dependencies]
base64 = "0.23.1"
dioxus = { version = "0.7.10", features = ["desktop"] }
etp-ffi = { version = "0.1.0", path = "etp-ffi" }
log = "0.4.34"
png = "0.18.1"
simplelog = "0.12.2"
tray-icon = "0.24.2"

[build-dependencies]
winresource = "0.1.31"
