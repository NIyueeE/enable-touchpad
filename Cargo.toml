[package]
name = "rust-agents-template"
version = "0.1.0"
edition = "2024"
description = "An agent-facing Rust project template with strict lints, layered git hooks, and CI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NIyueeE/rust-agents-template"

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[target."cfg(windows)".dependencies]
device_query = "4.0.1"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-desktop = { version = "0.7.10", features = ["transparent"] }
rdev = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tray-icon = "0.24.2"
