[package]
name = "rust-agents-template"
version = "0.1.0"
edition = "2024"
description = "An agent-facing Rust project template with strict lints, layered git hooks, and CI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NIyueeE/rust-agents-template"

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[target."cfg(windows)".dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
kanata = { version = "1.11.0", default-features = false, features = ["tcp_server", "win_sendinput_send_scancodes"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simplelog = "0.12.2"
tray-icon = "0.24.2"
