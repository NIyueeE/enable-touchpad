[package]
name = "rust-agents-template"
version = "0.1.0"
edition = "2024"
description = "An agent-facing Rust project template with strict lints, layered git hooks, and CI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NIyueeE/rust-agents-template"

[workspace]
members = [".", "etp-core", "etp-platform", "etp-ffi"]
default-members = [".", "etp-core", "etp-platform", "etp-ffi"]
resolver = "3"

[dependencies]
etp-core = { version = "0.1.0", path = "etp-core" }
etp-platform = { version = "0.1.0", path = "etp-platform" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[target."cfg(windows)".dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
log = "0.4.34"
simplelog = "0.12.2"
tray-icon = "0.24.2"
