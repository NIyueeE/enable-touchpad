name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: full check chain
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (supply-chain hardening); Dependabot
      # tracks the "# vX" comments. See AGENTS.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml (channel = stable + clippy/rustfmt) resolves
      # automatically; the pin freezes the action code, not the toolchain.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install check tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-machete,cargo-audit,cargo-outdated,cargo-deny

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Full check chain (fmt/machete/docs/clippy + audit/deny/outdated/test)
        run: just check
